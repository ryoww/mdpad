<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <title>無題.md — mdpad</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="command-bar">
        <div class="document-identity">
          <div class="document-copy">
            <div class="document-title-row">
              <span id="dirty-dot" class="dirty-dot" aria-hidden="true"></span>
              <strong id="document-name" data-testid="document-name">無題.md</strong>
            </div>
            <span id="document-path" class="document-path" data-testid="document-path">未保存の新規メモ</span>
          </div>
        </div>

        <nav class="command-actions" aria-label="ファイル操作">
          <div class="button-group">
            <button class="command-button" type="button" data-action="new" title="新規 (Ctrl+N)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.75 3.25h5l3.5 3.5v10H5.75v-13Z"/><path d="M10.75 3.25v3.5h3.5M10 9v5M7.5 11.5h5"/></svg>
              <span>新規</span>
            </button>
            <button class="command-button" type="button" data-action="open" title="開く (Ctrl+O)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 6.5h5l1.5-2h8v11.25h-14.5V6.5Z"/><path d="m3.25 15.75 2-6.25h12l-2 6.25"/></svg>
              <span>開く</span>
            </button>
          </div>
          <div class="button-group">
            <button id="save-button" class="command-button command-button--save" type="button" data-action="save" title="保存 (Ctrl+S)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.25 3.25h11.5l2 2v11.5H3.25V3.25Z"/><path d="M6 3.25V8h8V3.25M6.5 16.75v-5.5h7v5.5"/></svg>
              <span>保存</span>
            </button>
            <button class="command-button" type="button" data-action="save-as" title="名前を付けて保存 (Ctrl+Shift+S)">
              <span>別名保存</span>
            </button>
          </div>
          <button class="command-button command-button--quiet" type="button" data-action="find" title="検索 (Ctrl+F)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.75" cy="8.75" r="5.25"/><path d="m12.5 12.5 4 4"/></svg>
            <span>検索</span>
          </button>
        </nav>
      </header>

      <main class="editor-region" aria-label="編集領域">
        <div id="editor" data-testid="editor"></div>
      </main>

      <footer class="status-bar" aria-label="文書の状態">
        <div class="status-cluster">
          <span id="save-status" class="save-status" data-testid="save-status">
            <span class="status-indicator" aria-hidden="true"></span>
            保存済み
          </span>
          <span id="runtime-status" class="status-muted">localhost</span>
        </div>
        <div class="status-cluster status-cluster--right">
          <span id="character-status">0 文字</span>
          <span id="cursor-status">行 1、列 1</span>
          <span id="line-ending-status">LF</span>
          <span id="document-kind-status">Markdown</span>
          <span>UTF-8</span>
        </div>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
