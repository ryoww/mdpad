<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <title>無題.md — mdpad</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="menu-bar">
        <nav class="app-menu" aria-label="アプリケーションメニュー">
          <div class="menu-root" data-menu-root="file">
            <button
              class="menu-trigger"
              type="button"
              data-menu-trigger="file"
              aria-controls="file-menu"
              aria-expanded="false"
            >ファイル</button>
            <div id="file-menu" class="menu-popover" aria-label="ファイル" hidden>
              <button class="menu-item" type="button" data-action="new">
                <span>新規</span><kbd>Ctrl+N</kbd>
              </button>
              <button class="menu-item" type="button" data-action="open">
                <span>開く</span><kbd>Ctrl+O</kbd>
              </button>
              <div class="menu-separator" aria-hidden="true"></div>
              <button id="save-button" class="menu-item" type="button" data-action="save">
                <span>保存</span><kbd>Ctrl+S</kbd>
              </button>
              <button class="menu-item" type="button" data-action="save-as">
                <span>名前を付けて保存</span><kbd>Ctrl+Shift+S</kbd>
              </button>
            </div>
          </div>

          <div class="menu-root" data-menu-root="edit">
            <button
              class="menu-trigger"
              type="button"
              data-menu-trigger="edit"
              aria-controls="edit-menu"
              aria-expanded="false"
            >編集</button>
            <div id="edit-menu" class="menu-popover" aria-label="編集" hidden>
              <button class="menu-item" type="button" data-action="undo">
                <span>元に戻す</span><kbd>Ctrl+Z</kbd>
              </button>
              <button class="menu-item" type="button" data-action="redo">
                <span>やり直す</span><kbd>Ctrl+Y</kbd>
              </button>
              <div class="menu-separator" aria-hidden="true"></div>
              <button class="menu-item" type="button" data-action="find">
                <span>検索</span><kbd>Ctrl+F</kbd>
              </button>
            </div>
          </div>

          <div class="menu-root" data-menu-root="view">
            <button
              class="menu-trigger"
              type="button"
              data-menu-trigger="view"
              aria-controls="view-menu"
              aria-expanded="false"
            >表示</button>
            <div id="view-menu" class="menu-popover" aria-label="表示" hidden>
              <button
                id="preview-button"
                class="menu-item"
                type="button"
                data-action="preview"
                aria-pressed="false"
                aria-controls="preview"
              >
                <span>プレビュー</span><kbd>Ctrl+Shift+V</kbd>
              </button>
              <div class="menu-separator" aria-hidden="true"></div>
              <button
                id="line-wrap-button"
                class="menu-item"
                type="button"
                data-action="line-wrap"
                aria-pressed="false"
              >
                <span>行を折り返す</span><kbd>Alt+Z</kbd>
              </button>
              <div class="menu-separator" aria-hidden="true"></div>
              <button class="menu-item" type="button" data-action="zoom-in">
                <span>拡大</span><kbd>Ctrl++</kbd>
              </button>
              <button class="menu-item" type="button" data-action="zoom-out">
                <span>縮小</span><kbd>Ctrl+-</kbd>
              </button>
            </div>
          </div>
        </nav>
      </header>

      <main class="workspace-region">
        <section id="editor-region" class="editor-region" aria-label="編集領域">
          <div id="editor" data-testid="editor"></div>
        </section>
        <section id="preview-region" class="preview-region" aria-label="Markdown プレビュー" hidden>
          <article id="preview" class="markdown-preview" data-testid="preview" tabindex="0"></article>
          <div id="preview-empty" class="preview-empty" hidden>
            <strong>プレビューする内容がありません</strong>
            <span>編集画面に戻ってMarkdownを書き始めてください。</span>
          </div>
        </section>
      </main>

      <footer class="status-bar" aria-label="文書の状態">
        <div class="status-cluster status-cluster--document">
          <strong id="document-name" data-testid="document-name">無題.md</strong>
          <span id="save-status" class="save-status" data-testid="save-status" hidden>未保存</span>
          <span id="document-path" class="document-path" data-testid="document-path"></span>
        </div>
        <div class="status-cluster status-cluster--right">
          <span id="character-status" hidden>0 文字</span>
          <span id="document-kind-status" hidden>Markdown</span>
          <span id="line-ending-status" hidden>LF</span>
          <span id="line-wrap-status" hidden>折り返し</span>
          <span id="cursor-status">行 1、列 1</span>
        </div>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
